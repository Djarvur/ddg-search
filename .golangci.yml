# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

version: '2'

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  default: all
  disable:
    - exhaustruct # deprecated, replaced by exhaustruct_v5
    - exhaustruct_v5 # too noisy for partial struct initialization
    - ireturn # returning interfaces is acceptable
    - varnamelen # short variable names are idiomatic in Go
    - tagliatelle # JSON tags follow external API conventions
    - dupl # duplicate detection too noisy for small project
    - cyclop # cyclomatic complexity covered by other linters
    - depguard # project-internal imports trigger false positives
    - wsl # deprecated, replaced by wsl_v5
    - gomodguard # deprecated, replaced by gomodguard_v2
  settings:
    gocognit:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
  exclusions:
    rules:
      # Exclude errcheck for deferred Close() calls
      - linters:
          - errcheck
        text: 'Error return value of `.*Close` is not checked'
      # Allow longer lines in test files
      - linters:
          - lll
        path: _test\.go
      # Test files don't need separate package
      - linters:
          - testpackage
        path: _test\.go
